services:
  paddleocr:
    build: .
    image: anthony-paddleocr:latest
    container_name: anthony-paddleocr
    ports:
      - "8120:8000"
    volumes:
      - paddle-models:/root/.paddlex
    restart: unless-stopped
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  paddle-models:
