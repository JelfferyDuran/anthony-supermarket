version: '3.8'

services:
  superkitchen-mini-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: superkitchen-mini-app
    ports:
      - "3002:3002"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - BOT_URL=https://t.me/SuperAnthbot
    volumes:
      - ./server/data:/app/server/data
      - ./public/generated-images:/app/public/generated-images
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/api/health', (r) => { if (r.statusCode !== 200) process.exit(1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
