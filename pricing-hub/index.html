<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#07090d">
<title>Anthony's Pricing Hub — The Loading Dock</title>
<link rel="stylesheet" href="game.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<noscript>
  <div class="fatal">This experience needs JavaScript to run the 3D loading dock.</div>
</noscript>

<!-- 3D canvas -->
<canvas id="scene" aria-label="3D loading dock"></canvas>

<!-- floating 3D-anchored HTML labels (projected each frame) -->
<div id="labels" aria-hidden="true"></div>

<!-- Boot / loading overlay -->
<div id="loader" class="overlay-center">
  <div class="loader-box">
    <div class="loader-ring" aria-hidden="true"></div>
    <div class="loader-title">ANTHONY'S PRICING HUB</div>
    <div class="loader-sub" id="loaderStatus">Warming up the dock…</div>
  </div>
</div>

<!-- CDN / boot failure fallback -->
<div id="bootFail" class="overlay-center hidden">
  <div class="loader-box">
    <div class="loader-title">DOCK OFFLINE</div>
    <p class="fallback-text">The 3D engine (Three.js CDN) could not be loaded. Check your connection and reload.</p>
    <button class="btn primary" onclick="location.reload()">Reload</button>
  </div>
</div>

<!-- Sign-in gate: unauthenticated users see ONLY this -->
<div id="signin" class="overlay-center hidden">
  <div class="signin-card">
    <div class="signin-brand">
      <svg viewBox="0 0 48 48" class="brand-mark" aria-hidden="true">
        <rect x="6" y="18" width="36" height="22" rx="2" fill="none" stroke="#ffb020" stroke-width="3"/>
        <path d="M6 26h36" stroke="#ffb020" stroke-width="3"/>
        <rect x="18" y="8" width="12" height="10" fill="none" stroke="#22d3ee" stroke-width="3"/>
      </svg>
      <div>
        <div class="signin-title">THE LOADING DOCK</div>
        <div class="signin-sub">Anthony's Supermarket · Pricing Hub</div>
      </div>
    </div>
    <label class="field"><span>Email</span>
      <input id="signinEmail" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com">
    </label>
    <label class="field"><span>Password</span>
      <input id="signinPassword" type="password" autocomplete="current-password" placeholder="••••••••">
    </label>
    <div id="signinError" class="form-error" role="alert"></div>
    <button id="signinBtn" class="btn primary big">Sign in</button>
    <div class="signin-hint">Manager sign-in · sessions last 30 days</div>
  </div>
</div>

<!-- Persistent HUD -->
<header id="topbar">
  <div class="tb-left">
    <svg viewBox="0 0 48 48" class="tb-mark" aria-hidden="true">
      <rect x="6" y="18" width="36" height="22" rx="2" fill="none" stroke="#ffb020" stroke-width="3"/>
      <path d="M6 26h36" stroke="#ffb020" stroke-width="3"/>
      <rect x="18" y="8" width="12" height="10" fill="none" stroke="#22d3ee" stroke-width="3"/>
    </svg>
    <div class="tb-titles">
      <div class="tb-name">PRICING HUB</div>
      <div class="tb-zone" id="zoneName">DOCK</div>
    </div>
  </div>
  <div class="tb-right">
    <span id="clearedBadge" class="cleared-badge" title="Invoices cleared this session">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l6 6L20 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b id="clearedCount">0</b>
    </span>
    <span id="userEmail" class="tb-user"></span>
    <button id="signoutBtn" class="btn ghost small"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h8"/><path d="M10 12h11"/><path d="M18 8.5L21.5 12 18 15.5"/></svg><span>Sign out</span></button>
  </div>
</header>

<nav id="zonenav" aria-label="Zones">
  <button data-zone="dock" class="znav active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>DOCK</span>
  </button>
  <button data-zone="intake" class="znav">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><path d="M12 8.5v5"/><path d="M9.75 11L12 13.25l2.25-2.25"/></svg>
    <span>INTAKE</span>
  </button>
  <button data-zone="review" class="znav">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M9.5 13.5l2.25 2.25 4-4.75"/></svg>
    <span>REVIEW</span>
    <b id="reviewBadge" class="count-badge hidden">0</b>
  </button>
  <button data-zone="aisles" class="znav">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M4 9h16"/><path d="M4 15h16"/></svg>
    <span>AISLES</span>
  </button>
  <button data-zone="vault" class="znav">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="12" cy="12" r="3.5"/><path d="M12 10.4V12l1.8 1.2"/></svg>
    <span>VAULT</span>
  </button>
</nav>

<!-- The unmissable upload button -->
<button id="fab" aria-label="Upload an invoice">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<input type="file" id="filePicker" accept="application/pdf,image/jpeg,image/png,image/webp" hidden>

<!-- Upload progress HUD -->
<div id="uploadHud" class="hidden">
  <div class="upload-card">
    <svg class="upload-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4.2 7.6L12 12l7.8-4.4"/><path d="M12 12v8.7"/></svg>
    <div class="upload-ring" id="uploadRing"><span id="uploadPct">0%</span></div>
    <div class="upload-text">
      <div id="uploadTitle" class="upload-title">Uploading…</div>
      <div id="uploadSub" class="upload-sub"></div>
    </div>
    <button id="uploadCancel" class="btn ghost small">Cancel</button>
  </div>
</div>

<!-- Sliding detail panel -->
<div id="panelScrim" class="hidden"></div>
<aside id="panel" class="hidden" aria-live="polite">
  <div class="panel-grip"></div>
  <button id="panelClose" class="panel-close" aria-label="Close panel">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
  </button>
  <div id="panelBody"></div>
</aside>

<!-- Toasts -->
<div id="toasts" aria-live="assertive"></div>

<script>
  // Boot watchdog: if the module below never boots (CDN down), show the fallback.
  window.__hubBooted = false;
  setTimeout(function () {
    if (!window.__hubBooted) {
      document.getElementById('loader').classList.add('hidden');
      document.getElementById('bootFail').classList.remove('hidden');
    }
  }, 12000);
  window.addEventListener('error', function (e) {
    var msg = String((e && e.message) || '');
    if (/three|importmap|module/i.test(msg) && !window.__hubBooted) {
      document.getElementById('loader').classList.add('hidden');
      document.getElementById('bootFail').classList.remove('hidden');
    }
  }, true);
</script>
<script type="module" src="js/boot.js"></script>
</body>
</html>
