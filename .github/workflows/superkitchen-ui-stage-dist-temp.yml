name: Stage Super Kitchen UI Dist

on:
  pull_request:
    branches:
      - phase1-cutover-v3
    paths:
      - 'apps/superkitchen/src/**'
      - 'apps/superkitchen/index.html'
      - 'apps/superkitchen/package.json'
      - 'apps/superkitchen/package-lock.json'
      - 'apps/superkitchen/vite.config.*'
      - '.github/workflows/superkitchen-ui-stage-dist-temp.yml'

permissions:
  contents: read

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/superkitchen/package-lock.json
      - name: Build exact UI artifact
        working-directory: apps/superkitchen
        run: |
          set -euo pipefail
          npm ci --workspaces=false
          npm run build --workspaces=false
      - uses: actions/upload-artifact@v4
        with:
          name: superkitchen-ui-dist
          path: apps/superkitchen/dist
          if-no-files-found: error

  stage-dist:
    needs: build-dist
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase1-ui-polish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Replace tracked dist with reviewed artifact
        run: rm -rf apps/superkitchen/dist && mkdir -p apps/superkitchen/dist
      - uses: actions/download-artifact@v4
        with:
          name: superkitchen-ui-dist
          path: apps/superkitchen/dist
      - name: Commit generated Pages/Vercel artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f apps/superkitchen/dist
          if git diff --cached --quiet; then
            echo 'Tracked dist already matches the UI source.'
            exit 0
          fi
          git commit -m 'build(superkitchen): sync UI preview dist'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
