name: Storefront resilience
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/test-storefront-resilience.cjs'
      - '.github/workflows/storefront-resilience.yml'
permissions:
  contents: read
jobs:
  resilience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-storefront-resilience.cjs
