name: Super Kitchen CI

on:
  pull_request:
    paths:
      - 'apps/superkitchen/src/**'
      - 'apps/superkitchen/index.html'
      - 'apps/superkitchen/vercel.json'
      - 'apps/superkitchen/package.json'
      - 'apps/superkitchen/package-lock.json'
      - 'apps/superkitchen/vite.config.*'
      - 'supabase/functions/superkitchen/**'
      - 'supabase/migrations/**'
      - 'server/superkitchen-bot-v2.js'
      - 'server/.env.v2.example'
      - 'render.yaml'
      - '.github/workflows/superkitchen-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/superkitchen/src/**'
      - 'apps/superkitchen/index.html'
      - 'apps/superkitchen/vercel.json'
      - 'apps/superkitchen/package.json'
      - 'apps/superkitchen/package-lock.json'
      - 'apps/superkitchen/vite.config.*'
      - 'supabase/functions/superkitchen/**'
      - 'supabase/migrations/**'
      - 'server/superkitchen-bot-v2.js'
      - 'server/.env.v2.example'
      - 'render.yaml'
      - '.github/workflows/superkitchen-ci.yml'

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/superkitchen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/superkitchen/package-lock.json
      - name: Validate Vercel config when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f vercel.json ]]; then
            node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json is valid JSON')"
          fi
      - run: npm ci --workspaces=false
      - run: npm run build --workspaces=false
      - name: Package built Mini App for preview inspection
        uses: actions/upload-artifact@v4
        with:
          name: superkitchen-dist
          path: apps/superkitchen/dist
          if-no-files-found: error
          retention-days: 1

  stage-pages-dist:
    needs: frontend-build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase1-cutover-v2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Reset tracked Pages build directory
        run: |
          rm -rf apps/superkitchen/dist
          mkdir -p apps/superkitchen/dist
      - uses: actions/download-artifact@v4
        with:
          name: superkitchen-dist
          path: apps/superkitchen/dist
      - name: Commit reviewed build artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f apps/superkitchen/dist
          if git diff --cached --quiet; then
            echo 'Tracked Pages build is already current.'
            exit 0
          fi
          git commit -m 'build(superkitchen): refresh Pages dist [skip ci]'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  bot-v2-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse secure bot v2 when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f server/superkitchen-bot-v2.js ]]; then
            node --check server/superkitchen-bot-v2.js
          else
            echo 'Bot v2 is not on this branch yet; syntax check will activate when it is added.'
          fi

  security-source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(TELEGRAM_TOKEN|SUPABASE_SERVICE_ROLE_KEY|OPENAI_API_KEY)=[^[:space:]]+' -- ':!*.example' ':!*.md'; then
            echo 'Potential secret value committed. Move it to deployment secrets.'
            exit 1
          fi
      - name: Keep service-role credentials out of browser code
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'SUPABASE_SERVICE_ROLE_KEY' -- apps/superkitchen/src; then
            echo 'Service-role credentials must never appear in browser code.'
            exit 1
          fi
