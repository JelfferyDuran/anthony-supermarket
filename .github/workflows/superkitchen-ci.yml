name: Super Kitchen CI

on:
  pull_request:
    paths:
      - 'apps/superkitchen/src/**'
      - 'apps/superkitchen/index.html'
      - 'apps/superkitchen/dist/**'
      - 'apps/superkitchen/vercel.json'
      - 'apps/superkitchen/package.json'
      - 'apps/superkitchen/package-lock.json'
      - 'apps/superkitchen/vite.config.*'
      - 'supabase/functions/superkitchen/**'
      - 'supabase/functions/superkitchen-ops/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'scripts/hermes-ops-check.mjs'
      - 'server/superkitchen-bot-v2.js'
      - 'server/.env.v2.example'
      - 'render.yaml'
      - '.github/workflows/superkitchen-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/superkitchen/src/**'
      - 'apps/superkitchen/index.html'
      - 'apps/superkitchen/dist/**'
      - 'apps/superkitchen/vercel.json'
      - 'apps/superkitchen/package.json'
      - 'apps/superkitchen/package-lock.json'
      - 'apps/superkitchen/vite.config.*'
      - 'supabase/functions/superkitchen/**'
      - 'supabase/functions/superkitchen-ops/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'scripts/hermes-ops-check.mjs'
      - 'server/superkitchen-bot-v2.js'
      - 'server/.env.v2.example'
      - 'render.yaml'
      - '.github/workflows/superkitchen-ci.yml'

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/superkitchen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/superkitchen/package-lock.json
      - name: Validate Vercel config when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f vercel.json ]]; then
            node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json is valid JSON')"
          fi
      - run: npm ci --workspaces=false
      - run: npm run build --workspaces=false
      - name: Verify tracked Pages build matches source
        shell: bash
        run: |
          set -euo pipefail
          git add -A -f dist
          if ! git diff --cached --exit-code -- dist; then
            echo 'apps/superkitchen/dist is stale. Rebuild and commit the generated Pages artifact.'
            exit 1
          fi

  bot-v2-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse secure bot v2 when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f server/superkitchen-bot-v2.js ]]; then
            node --check server/superkitchen-bot-v2.js
          else
            echo 'Bot v2 is not on this branch yet; syntax check will activate when it is added.'
          fi

  ops-observer-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Parse Hermes observer client
        run: node --check scripts/hermes-ops-check.mjs
      - name: Type-check observer Edge Function
        run: deno check --config supabase/functions/superkitchen-ops/deno.json supabase/functions/superkitchen-ops/index.ts
      - name: Require JWT verification for observer function
        shell: python
        run: |
          import pathlib, tomllib
          config = tomllib.loads(pathlib.Path('supabase/config.toml').read_text())
          assert config['functions']['superkitchen-ops']['verify_jwt'] is True, 'superkitchen-ops must keep verify_jwt=true'
      - name: Keep observer response free of customer PII fields
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\b(cliente|telefono|direccion|notas|telegram_user_id|telegram_auth_date)\b' supabase/functions/superkitchen-ops/index.ts; then
            echo 'Observer function must not query or expose customer PII or Telegram identity fields.'
            exit 1
          fi
      - name: Keep observer API read-only
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\.(insert|update|delete|upsert)\s*\(' supabase/functions/superkitchen-ops/index.ts; then
            echo 'Observer function must remain read-only.'
            exit 1
          fi
      - name: Keep service-role credentials out of Hermes client
        shell: bash
        run: |
          set -euo pipefail
          if grep -n 'SUPABASE_SERVICE_ROLE_KEY' scripts/hermes-ops-check.mjs; then
            echo 'Hermes observer client must never use the Supabase service-role key.'
            exit 1
          fi

  security-source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(TELEGRAM_TOKEN|SUPABASE_SERVICE_ROLE_KEY|OPENAI_API_KEY)=[^[:space:]]+' -- ':!*.example' ':!*.md'; then
            echo 'Potential secret value committed. Move it to deployment secrets.'
            exit 1
          fi
      - name: Keep service-role credentials out of browser code
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'SUPABASE_SERVICE_ROLE_KEY' -- apps/superkitchen/src; then
            echo 'Service-role credentials must never appear in browser code.'
            exit 1
          fi
