name: Stage Super Kitchen Dist

on:
  pull_request:
    paths:
      - 'apps/superkitchen/src/**'
      - 'apps/superkitchen/index.html'
      - 'apps/superkitchen/package.json'
      - 'apps/superkitchen/package-lock.json'
      - 'apps/superkitchen/vite.config.*'
      - '.github/workflows/stage-superkitchen-dist.yml'

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/superkitchen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/superkitchen/package-lock.json
      - run: npm ci --workspaces=false
      - run: npm run build --workspaces=false
      - uses: actions/upload-artifact@v4
        with:
          name: superkitchen-dist
          path: apps/superkitchen/dist
          if-no-files-found: error
          retention-days: 1

  stage:
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase1-cutover-v3'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: |
          rm -rf apps/superkitchen/dist
          mkdir -p apps/superkitchen/dist
      - uses: actions/download-artifact@v4
        with:
          name: superkitchen-dist
          path: apps/superkitchen/dist
      - name: Commit reviewed Pages build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f apps/superkitchen/dist
          if git diff --cached --quiet; then
            echo 'Tracked Pages build is already current.'
            exit 0
          fi
          git commit -m 'build(superkitchen): refresh Pages dist [skip ci]'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
