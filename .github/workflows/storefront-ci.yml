name: Storefront CI

on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/check-storefront-guardrails.mjs'
      - '.github/workflows/storefront-ci.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/check-storefront-guardrails.mjs'
      - '.github/workflows/storefront-ci.yml'

permissions:
  contents: read

jobs:
  storefront-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-storefront-guardrails.mjs
