<head>

<style>
  :root{
    --bg:#12120F; --bg-2:#1A1A15; --line:#2E2C24;
    --paper:#FDF6E3; --paper-2:#F1E6C8; --ink:#22201A; --ink-dim:#6B6455;
    --green:#2D6A4F; --green-l:#40916C; --gold:#D4A017; --red:#C0392B; --accent:#E07A2F;
    --text:#F2EEE3; --text-dim:#9A9484;
    --radius:14px;
    --serif:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif;
    --sans:'Segoe UI',system-ui,-apple-system,Roboto,Arial,Helvetica,sans-serif;
    --safe-b:env(safe-area-inset-bottom,0px);
    /* card width is bounded by viewport HEIGHT too, so the rack never outgrows the stage
       (matters in phone landscape, where width is plentiful and height is not) */
    --cw:clamp(180px,min(56vw,42vh),280px);
  }
  @supports (height:100svh){ :root{ --cw:clamp(180px,min(56vw,42svh),280px); } }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.55;overflow-x:hidden;}
  img{max-width:100%;display:block;}
  :focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px;}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:.65rem clamp(.9rem,5vw,3rem);background:rgba(18,18,15,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .brand{font-family:var(--serif);font-weight:700;color:var(--green-l);letter-spacing:.4px;font-size:1rem;line-height:1.15;}
  .brand small{display:block;font-family:var(--sans);font-size:.6rem;color:var(--text-dim);letter-spacing:1.4px;text-transform:uppercase;}
  .top-right{display:flex;align-items:center;gap:.4rem;}
  .lang-btn{background:var(--bg-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:.4rem .75rem;
    font-size:.72rem;font-weight:700;cursor:pointer;font-family:inherit;min-height:38px;min-width:44px;}
  .lang-btn.active{background:var(--green);border-color:var(--green);color:#fff;}

  /* ---------- hero ---------- */
  .hero{position:relative;text-align:center;padding:clamp(1.8rem,6vw,3.4rem) clamp(.9rem,5vw,3rem) clamp(1.4rem,4vw,2.4rem);overflow:hidden;}
  .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% -25%,rgba(45,106,79,.4),transparent 62%);pointer-events:none;}
  .hero h1{position:relative;font-family:var(--serif);font-size:clamp(2.1rem,10vw,4.2rem);font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;line-height:1.02;}
  .hero h1 .r{color:var(--red);} .hero h1 .g{color:var(--green-l);}
  .hero .sub{position:relative;color:var(--text-dim);margin-top:.6rem;font-size:clamp(.86rem,2.4vw,1.05rem);max-width:44ch;margin-inline:auto;}
  .deal-hero{position:relative;display:inline-flex;align-items:center;gap:clamp(.7rem,3vw,1.4rem);margin-top:1.4rem;
    background:var(--paper);color:var(--ink);border:2px solid var(--gold);border-radius:16px;padding:clamp(.8rem,3vw,1.1rem) clamp(1rem,4vw,1.7rem);
    flex-wrap:wrap;justify-content:center;box-shadow:0 18px 44px rgba(0,0,0,.45);}
  .deal-hero .price{font-family:var(--serif);font-size:clamp(1.5rem,7vw,2.7rem);font-weight:700;color:#8a1c12;line-height:1;white-space:nowrap;}
  .deal-hero .price b{color:var(--red);}
  .deal-hero .meta{text-align:left;font-size:clamp(.74rem,2vw,.82rem);color:var(--ink-dim);line-height:1.45;}
  .deal-hero .meta b{color:var(--ink);display:block;}
  .chip{display:inline-block;background:var(--red);color:#fff;font-size:.66rem;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;border-radius:999px;padding:.35rem .85rem;}
  .fomo{background:repeating-linear-gradient(135deg,var(--red),var(--red) 18px,#a82a1d 18px,#a82a1d 36px);color:#fff;text-align:center;
    padding:.85rem clamp(.9rem,5vw,3rem);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:clamp(.7rem,2.4vw,.92rem);}

  /* ---------- sections ---------- */
  .section{padding:clamp(2rem,6vw,3.2rem) clamp(.9rem,5vw,3rem);max-width:1280px;margin:0 auto;}
  .section-title{font-family:var(--serif);font-size:clamp(1.4rem,5vw,2.2rem);font-weight:700;text-transform:uppercase;
    letter-spacing:.5px;text-align:center;margin-bottom:.35rem;}
  .section-title span{color:var(--accent);}
  .section-sub{text-align:center;color:var(--text-dim);font-size:clamp(.82rem,2.2vw,.94rem);max-width:56ch;margin:0 auto 1.5rem;}

  /* ---------- showcase / rack ---------- */
  .showcase{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:
    radial-gradient(ellipse at 50% 120%,rgba(45,106,79,.28),transparent 60%),var(--bg-2);overflow:hidden;}
  .stage{position:relative;height:clamp(360px,60vh,500px);perspective:1200px;perspective-origin:50% 45%;
    touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;}
  @supports (height:100svh){ .stage{height:clamp(360px,60svh,500px);} }
  .stage.dragging{cursor:grabbing;}
  .stage::after{content:'';position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:min(76%,520px);height:26px;
    background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);pointer-events:none;}
  .rack{position:absolute;inset:0;transform-style:preserve-3d;}
  .pcard{position:absolute;left:50%;top:50%;width:var(--cw);transform-style:preserve-3d;
    will-change:transform,opacity;transform:translate(-50%,-50%);}
  .pcard-in{position:relative;background:var(--paper);color:var(--ink);border-radius:12px;overflow:hidden;
    border:2px solid var(--green);box-shadow:0 20px 46px rgba(0,0,0,.55);}
  .pcard-in::before{content:'';position:absolute;top:0;left:0;right:0;height:7px;background:var(--gold);z-index:2;}
  .pcard .ph{position:relative;aspect-ratio:1/1;background:var(--paper-2);overflow:hidden;}
  .pcard .ph img{width:100%;height:100%;object-fit:cover;}
  .pcard .bd{padding:.7rem .8rem .85rem;text-align:center;}
  .pcard .code{font-size:.62rem;font-weight:800;letter-spacing:.12em;color:#8a6a08;text-transform:uppercase;}
  .pcard .nm{font-family:var(--serif);font-size:clamp(.98rem,3.4vw,1.2rem);font-weight:700;line-height:1.18;margin:.2rem 0 .3rem;}
  .pcard .pr{display:inline-block;background:var(--gold);color:#211c05;font-weight:900;font-size:clamp(.86rem,3vw,1rem);
    letter-spacing:.03em;border-radius:999px;padding:.22rem .8rem;}
  .pcard .wt{font-size:.68rem;color:var(--ink-dim);margin-top:.32rem;}
  .pcard .wsl{margin-top:.5rem;background:var(--green);color:#fff;font-size:.56rem;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;padding:.34rem .4rem;border-radius:6px;}
  .pcard.is-center .pcard-in{border-color:var(--gold);box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 3px rgba(212,160,23,.32);}
  .pcard.pulse .pcard-in{animation:pulse .5s ease;}
  @keyframes pulse{0%{box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 3px rgba(212,160,23,.32);}
    50%{box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 0 12px rgba(212,160,23,.05);}
    100%{box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 3px rgba(212,160,23,.32);}}

  .hint{font-size:.63rem;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;text-align:center;
    padding:.7rem .8rem .1rem;pointer-events:none;}
  .navbtn{position:absolute;top:50%;transform:translateY(-50%);z-index:25;width:44px;height:44px;border-radius:50%;
    background:rgba(18,18,15,.72);border:1px solid var(--line);color:var(--text);font-size:1.2rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .navbtn:hover{background:var(--green);border-color:var(--green);}
  .navbtn[disabled]{opacity:.28;cursor:default;}
  .navbtn.prev{left:.5rem;} .navbtn.next{right:.5rem;}
  .dots{display:flex;gap:.4rem;justify-content:center;padding:.7rem;flex-wrap:wrap;border-top:1px solid var(--line);}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);border:none;padding:0;cursor:pointer;}
  .dot.on{background:var(--gold);transform:scale(1.25);}
  .dot-hit{background:none;border:none;padding:9px;min-width:27px;min-height:27px;cursor:pointer;line-height:0;display:block;}

  /* ---------- detail: desktop panel / mobile sheet ---------- */
  .sheet-bd{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;opacity:0;transition:opacity .22s ease;}
  .sheet-bd.on{display:block;opacity:1;}
  .detail{background:var(--bg-2);border-top:1px solid var(--line);padding:1rem clamp(1rem,4vw,1.5rem);}
  .detail .d-head{display:flex;align-items:flex-start;gap:.8rem;flex-wrap:wrap;}
  .detail .d-tag{font-size:.63rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);flex-basis:100%;}
  .detail .d-name{font-family:var(--serif);font-size:clamp(1.15rem,4vw,1.5rem);font-weight:700;}
  .detail .d-price{margin-left:auto;font-weight:900;font-size:clamp(1.1rem,4vw,1.4rem);color:var(--gold);white-space:nowrap;}
  .detail .d-desc{font-size:.88rem;color:var(--text-dim);margin-top:.5rem;}
  .detail .d-actions{display:flex;gap:.55rem;flex-wrap:wrap;margin-top:.9rem;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:var(--green);color:#fff;border:none;
    border-radius:9px;padding:.62rem 1.05rem;font-size:.83rem;font-weight:700;cursor:pointer;font-family:inherit;
    text-decoration:none;min-height:44px;}
  .btn:hover{background:var(--green-l);}
  .btn.wa{background:#25D366;color:#08341a;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn.gold{background:var(--gold);color:#211c05;}
  .grab{display:none;}
  .d-close{display:none;}

  @media (max-width:860px){
    .detail{position:fixed;left:0;right:0;bottom:0;z-index:80;border-radius:18px 18px 0 0;border:1px solid var(--line);
      padding-bottom:calc(1rem + var(--safe-b));transform:translateY(102%);transition:transform .28s cubic-bezier(.22,1,.36,1);
      max-height:82svh;overflow-y:auto;box-shadow:0 -18px 50px rgba(0,0,0,.6);}
    .detail.open{transform:translateY(0);}
    .grab{display:block;width:44px;height:5px;border-radius:99px;background:var(--line);margin:-.25rem auto .6rem;}
    .d-close{display:inline-flex;}
    .grab-zone{padding:.5rem 0 .1rem;margin:-.5rem 0 0;touch-action:none;cursor:grab;}
  }
  @media (min-width:861px){
    .detail{display:block !important;transform:none !important;}
    .showcase.wide{display:grid;grid-template-columns:1fr minmax(280px,340px);}
    .showcase.wide .detail{border-top:none;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;}
    .showcase.wide .dots{grid-column:1;}
  }

  /* ---------- static grid fallback (browsers without CSS 3D) ---------- */
  @supports not (transform-style:preserve-3d){
    .stage{height:auto;perspective:none;}
    .rack{position:static;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem;padding:1rem;}
    .pcard{position:static;width:auto;transform:none !important;opacity:1 !important;}
    .navbtn,.hint{display:none;}
  }

  /* ---------- other sections ---------- */
  .how{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-top:1.4rem;}
  .how-card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:1.2rem;text-align:center;}
  .how-card .n{font-family:var(--serif);font-size:1.7rem;font-weight:700;color:var(--accent);}
  .how-card h3{font-size:.98rem;margin:.35rem 0 .3rem;}
  .how-card p{font-size:.82rem;color:var(--text-dim);}
  .chips-row{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center;margin-top:1.1rem;}
  .pchip{background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:.5rem 1.1rem;font-size:.85rem;font-weight:700;}
  .pchip .tag{color:var(--accent);font-size:.62rem;display:block;text-transform:uppercase;letter-spacing:.08em;}
  .recipes{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1rem;margin-top:1.4rem;}
  .recipe{background:var(--paper);color:var(--ink);border:1px solid var(--gold);border-radius:var(--radius);padding:1.15rem;}
  .recipe h3{font-family:var(--serif);color:#8a1c12;font-size:1.02rem;margin-bottom:.45rem;}
  .recipe p{font-size:.86rem;color:#4a463c;}
  .recipe b{color:var(--ink);}
  .poster-row{display:flex;gap:1.5rem;justify-content:center;align-items:flex-start;padding:0 clamp(.9rem,5vw,3rem) 1rem;flex-wrap:wrap;}
  .poster-img{width:min(340px,88vw);border-radius:var(--radius);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .poster-caption{font-size:.72rem;color:var(--text-dim);text-align:center;margin-top:.5rem;}
  .share-bar{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;padding:1.4rem clamp(.9rem,5vw,3rem);}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + var(--safe-b));transform:translateX(-50%) translateY(140%);
    background:var(--gold);color:#211c05;font-weight:800;font-size:.82rem;padding:.6rem 1.1rem;border-radius:999px;z-index:200;
    transition:transform .26s cubic-bezier(.22,1,.36,1);pointer-events:none;}
  .toast.on{transform:translateX(-50%) translateY(0);}
  .footer{margin-top:1rem;border-top:1px solid var(--line);padding:2rem clamp(.9rem,5vw,3rem) calc(2rem + var(--safe-b));
    text-align:center;color:var(--text-dim);font-size:.85rem;background:var(--bg-2);}
  .footer .fbrand{font-family:var(--serif);font-weight:700;color:var(--green-l);font-size:1.15rem;letter-spacing:.5px;}
  .footer a{color:var(--green-l);text-decoration:none;}
  .footer .frow{display:flex;gap:1.1rem;justify-content:center;flex-wrap:wrap;margin-top:.8rem;}
  .state{text-align:center;padding:2.5rem 1rem;color:var(--text-dim);font-size:.9rem;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }
</style>
</head>

<script>
/* ============================================================
   Anthony's Supermarket — Sales page v2
   Data-driven (data/sale.json), no WebGL, no external libraries.
   Card rack = CSS 3D transforms + pointer inertia + snap.
   ============================================================ */
(function(){
  "use strict";

  var cl = "en";                       // current language
  var CFG = null;                      // loaded config
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var mqSheet = window.matchMedia ? window.matchMedia("(max-width:860px)") : {matches:false};

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  /* Pick the language variant of a { en, es } field. Plain strings pass through. */
  function L(field){
    if(field == null) return "";
    if(typeof field === "string") return field;
    return field[cl] != null ? field[cl] : (field.en != null ? field.en : "");
  }
  function setText(id,v){ var el=$(id); if(el) el.textContent=v; }
  function setHTML(id,v){ var el=$(id); if(el) el.innerHTML=v; }

  /* ---------- language ---------- */
  function setLang(l){
    cl = (l === "es") ? "es" : "en";
    document.documentElement.lang = cl;
    var btns = document.querySelectorAll(".lang-btn");
    for(var i=0;i<btns.length;i++){
      btns[i].classList.toggle("active", btns[i].textContent.toLowerCase().indexOf(cl) >= 0);
    }
    try{ localStorage.setItem("anthony-lang", cl); }catch(e){}
    if(CFG) render();
    try{ document.dispatchEvent(new CustomEvent("langchange")); }catch(e){}
  }
  window.setLang = setLang;                       // used by the inline onclick handlers

  /* ---------- share helpers ---------- */
  function pageUrl(){ return location.href.split("#")[0]; }
  function waLink(text){ return "https://wa.me/?text=" + encodeURIComponent(text + " " + pageUrl()); }
  function fillTokens(tpl,p){
    return String(tpl)
      .replace(/\{name\}/g, L(p.name))
      .replace(/\{code\}/g, p.brand ? (p.brand + " " + p.code) : p.code)
      .replace(/\{price\}/g, L(CFG.deal.cardPrice));
  }
  var toastTimer = null;
  function toast(msg){
    var el = $("toast"); if(!el) return;
    el.textContent = msg; el.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("on"); }, 2200);
  }
  function copyText(txt){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast(L(CFG.share.copied)); }, fallbackCopy);
    } else { fallbackCopy(); }
    function fallbackCopy(){
      try{
        var ta = document.createElement("textarea");
        ta.value = txt; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.select(); document.execCommand("copy");
        document.body.removeChild(ta); toast(L(CFG.share.copied));
      }catch(e){}
    }
  }

  /* ============================================================
     The rack: CSS 3D carousel with drag inertia + snap
     ============================================================ */
  var rackEl, stageEl, cardEls = [], pos = 0, target = 0, n = 0;
  var spacingPx = 200, depth = 190, angle = 42, VISIBLE = 3.4;
  var anim = null, live = true;

  function measure(){
    if(!cardEls.length) return;
    var w = cardEls[0].offsetWidth || 220;
    spacingPx = Math.max(120, w * 0.66);
    depth = w * 0.85;
    angle = window.innerWidth < 560 ? 36 : 44;
  }

  function place(){
    var center = Math.round(pos);
    hydrate(center);
    for(var i=0;i<cardEls.length;i++){
      var el = cardEls[i], d = i - pos, ad = Math.abs(d);
      if(ad > VISIBLE){ el.style.visibility = "hidden"; continue; }
      el.style.visibility = "visible";
      var sc = Math.max(0.68, 1 - ad * 0.13);
      var op = Math.max(0, 1 - ad * 0.3);
      el.style.transform =
        "translate(-50%,-50%) translateX(" + (d * spacingPx).toFixed(2) + "px)" +
        " translateZ(" + (-ad * depth).toFixed(2) + "px)" +
        " rotateY(" + (-d * angle).toFixed(2) + "deg)" +
        " scale(" + sc.toFixed(3) + ")";
      el.style.opacity = op.toFixed(3);
      el.style.zIndex = String(1000 - Math.round(ad * 100));
      var isC = (i === center);
      el.classList.toggle("is-center", isC);
      el.setAttribute("aria-selected", isC ? "true" : "false");
      el.tabIndex = isC ? 0 : -1;
    }
    var dots = $("dots").children;
    for(var k=0;k<dots.length;k++){
      var dt = dots[k].firstChild;
      if(dt) dt.classList.toggle("on", k === center);
    }
    $("btnPrev").disabled = (center <= 0);
    $("btnNext").disabled = (center >= n - 1);
  }

  function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }

  function animateTo(to, dur){
    to = clamp(to, 0, n - 1);
    target = to;
    if(anim){ cancelAnimationFrame(anim); anim = null; }
    if(reduced || !live){ pos = to; place(); showDetail(to, false); return; }
    var from = pos, dist = Math.abs(to - from);
    if(dist < 0.0005){ pos = to; place(); showDetail(to, false); return; }
    var d = dur || clamp(260 + dist * 130, 260, 620);
    var t0 = performance.now();
    (function step(now){
      var p = clamp((now - t0) / d, 0, 1);
      var e = 1 - Math.pow(1 - p, 3);           // ease-out cubic
      pos = from + (to - from) * e;
      place();
      if(p < 1){ anim = requestAnimationFrame(step); }
      else { anim = null; pos = to; place(); showDetail(to, false); }
    })(performance.now());
  }

  function go(i){ animateTo(clamp(i, 0, n - 1)); }

  /* ---------- pointer drag with inertia ---------- */
  function bindDrag(){
    var down = false, axis = null, id = null;
    var sx = 0, sy = 0, startPos = 0, lastX = 0, lastT = 0, vel = 0, moved = 0;

    stageEl.addEventListener("pointerdown", function(e){
      if(e.button != null && e.button !== 0) return;
      down = true; axis = null; id = e.pointerId;
      sx = lastX = e.clientX; sy = e.clientY; lastT = performance.now();
      startPos = pos; vel = 0; moved = 0;
      if(anim){ cancelAnimationFrame(anim); anim = null; }
    });

    stageEl.addEventListener("pointermove", function(e){
      if(!down) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if(axis === null){
        if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
        if(axis === "x"){
          stageEl.classList.add("dragging");
          if(stageEl.setPointerCapture){ try{ stageEl.setPointerCapture(id); }catch(err){} }
        }
      }
      if(axis !== "x") return;
      e.preventDefault();
      moved = Math.abs(dx);
      var raw = startPos - dx / spacingPx;
      /* rubber-band past the ends */
      if(raw < 0) raw = raw * 0.35;
      else if(raw > n - 1) raw = (n - 1) + (raw - (n - 1)) * 0.35;
      var now = performance.now(), dt = now - lastT;
      if(dt > 0){
        var inst = -((e.clientX - lastX) / spacingPx) / dt;   // index per ms
        vel = vel * 0.7 + inst * 0.3;
        lastX = e.clientX; lastT = now;
      }
      pos = raw; place();
    });

    function release(){
      if(!down) return;
      down = false;
      stageEl.classList.remove("dragging");
      if(axis !== "x"){ axis = null; return; }
      axis = null;
      /* project the fling, then snap to the nearest card */
      var proj = clamp(vel * 190, -3, 3);
      if(!isFinite(proj)) proj = 0;
      animateTo(Math.round(clamp(pos + proj, 0, n - 1)));
      vel = 0;
    }
    stageEl.addEventListener("pointerup", release);
    stageEl.addEventListener("pointercancel", release);
    stageEl.addEventListener("lostpointercapture", release);

    /* tap = select (only when the pointer barely moved) */
    stageEl.addEventListener("click", function(e){
      var card = e.target.closest ? e.target.closest(".pcard") : null;
      if(!card || moved > 8) return;
      var i = parseInt(card.getAttribute("data-i"), 10);
      if(isNaN(i)) return;
      if(i === Math.round(pos)) openSheet(i); else go(i);
    });

    /* horizontal wheel / trackpad */
    var wheelLock = false;
    stageEl.addEventListener("wheel", function(e){
      if(Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;   // let vertical scroll through
      e.preventDefault();
      if(wheelLock) return;
      wheelLock = true;
      setTimeout(function(){ wheelLock = false; }, 220);
      go(Math.round(pos) + (e.deltaX > 0 ? 1 : -1));
    }, {passive:false});
  }

  function bindKeys(){
    rackEl.addEventListener("keydown", function(e){
      var k = e.key;
      if(k === "ArrowRight"){ e.preventDefault(); go(Math.round(pos) + 1); }
      else if(k === "ArrowLeft"){ e.preventDefault(); go(Math.round(pos) - 1); }
      else if(k === "Home"){ e.preventDefault(); go(0); }
      else if(k === "End"){ e.preventDefault(); go(n - 1); }
      else if(k === "Enter" || k === " " || k === "Spacebar"){ e.preventDefault(); openSheet(Math.round(pos)); }
    });
    document.addEventListener("keydown", function(e){
      if(e.key === "Escape" && $("detail").classList.contains("open")) closeSheet();
    });
  }

  /* ============================================================
     Detail panel (desktop) / bottom sheet (mobile)
     ============================================================ */
  var lastFocus = null;

  function showDetail(i, pulse){
    var p = CFG.products[i]; if(!p) return;
    setText("dTag", (p.brand ? p.brand + " " : "") + p.code + " · " + p.weight);
    setText("dName", L(p.name));
    setText("dPrice", L(CFG.deal.cardPrice));
    setText("dDesc", L(p.facts));
    $("dMaps").href = CFG.store.mapsUrl;
    $("dMaps").textContent = L(CFG.store.directions);
    $("dShare").href = waLink(fillTokens(L(CFG.share.productText), p));
    $("dShare").textContent = "💬 " + L(CFG.share.buttonProduct);
    setText("live", L(p.name) + " — " + L(CFG.deal.cardPrice));
    if(pulse && cardEls[i] && !reduced){
      cardEls[i].classList.remove("pulse");
      void cardEls[i].offsetWidth;
      cardEls[i].classList.add("pulse");
    }
  }
  function openSheet(i){
    showDetail(i, true);
    if(!mqSheet.matches) return;                 // desktop: panel is always visible
    lastFocus = document.activeElement;
    $("detail").classList.add("open");
    $("detail").setAttribute("aria-modal","true");
    $("sheetBd").classList.add("on");
    $("detail").focus();
  }
  function closeSheet(){
    $("detail").classList.remove("open");
    $("detail").setAttribute("aria-modal","false");
    $("sheetBd").classList.remove("on");
    if(lastFocus && lastFocus.focus){ lastFocus.focus(); lastFocus = null; }
  }

  function bindSheet(){
    $("sheetBd").addEventListener("click", closeSheet);
    $("dClose").addEventListener("click", closeSheet);
    /* drag the sheet down to dismiss */
    var gz = $("grabZone"), sy = 0, dragging = false;
    gz.addEventListener("pointerdown", function(e){
      if(!mqSheet.matches) return;
      dragging = true; sy = e.clientY;
      $("detail").style.transition = "none";
      if(gz.setPointerCapture){ try{ gz.setPointerCapture(e.pointerId); }catch(err){} }
    });
    gz.addEventListener("pointermove", function(e){
      if(!dragging) return;
      var dy = Math.max(0, e.clientY - sy);
      $("detail").style.transform = "translateY(" + dy + "px)";
    });
    function end(e){
      if(!dragging) return;
      dragging = false;
      var dy = Math.max(0, (e.clientY || 0) - sy);
      $("detail").style.transition = "";
      $("detail").style.transform = "";
      if(dy > 90) closeSheet();
    }
    gz.addEventListener("pointerup", end);
    gz.addEventListener("pointercancel", end);
  }

  /* ============================================================
     Rendering from config
     ============================================================ */
  /* mode: "eager" (LCP candidate) | "lazy" (native, in normal flow) |
            "deferred" (held back until hydrate() decides the card is near the centre)

     Cards are stacked at the same point in the stage, so every one of them counts as
     "in the viewport" and native loading="lazy" would still fetch all seven up front.
     Deferred cards therefore carry data-src and are promoted by hydrate(). */
  function picture(base, ext, cls, alt, mode){
    var deferred = (mode === "deferred");
    var srcsetAttr = deferred ? "data-srcset" : "srcset";
    var srcAttr    = deferred ? "data-src"    : "src";
    var loadAttr   = (mode === "eager") ? ' fetchpriority="high" loading="eager"'
                   : (mode === "lazy")  ? ' loading="lazy"' : '';
    return '<picture>' +
      '<source ' + srcsetAttr + '="' + esc(base) + '.webp" type="image/webp">' +
      '<img class="' + cls + '" ' + srcAttr + '="' + esc(base) + '.' + esc(ext) + '"' +
      ' alt="' + esc(alt) + '" decoding="async"' + loadAttr + '>' +
      '</picture>';
  }

  /* Promote deferred images for every card within HYDRATE_WINDOW of the centre. */
  var HYDRATE_WINDOW = 2;
  function hydrate(center){
    for(var i=0;i<cardEls.length;i++){
      if(Math.abs(i - center) > HYDRATE_WINDOW) continue;
      var pic = cardEls[i].querySelector("picture");
      if(!pic || pic.getAttribute("data-hydrated")) continue;
      /* the <source> must be set before the <img>, or the browser resolves to the jpg */
      var s = pic.querySelector("source[data-srcset]");
      if(s){ s.setAttribute("srcset", s.getAttribute("data-srcset")); s.removeAttribute("data-srcset"); }
      var im = pic.querySelector("img[data-src]");
      if(im){ im.setAttribute("src", im.getAttribute("data-src")); im.removeAttribute("data-src"); }
      pic.setAttribute("data-hydrated","1");
    }
  }

  function renderCards(){
    var html = "", dots = "";
    for(var i=0;i<CFG.products.length;i++){
      var p = CFG.products[i];
      html += '<article class="pcard" data-i="' + i + '" role="option" aria-selected="false" tabindex="-1">' +
                '<div class="pcard-in">' +
                  '<div class="ph">' + picture(p.image, "jpg", "", L(p.name) + " — " + p.brand + " " + p.code,
                                               i === 0 ? "eager" : "deferred") + '</div>' +
                  '<div class="bd">' +
                    '<div class="code">' + esc((p.brand ? p.brand + " · " : "") + p.code) + '</div>' +
                    '<h3 class="nm">' + esc(L(p.name)) + '</h3>' +
                    '<div class="pr">' + esc(L(CFG.deal.cardPrice)) + '</div>' +
                    '<div class="wt">' + esc(p.weight) + '</div>' +
                    '<div class="wsl">' + esc(L(CFG.deal.badge)) + '</div>' +
                  '</div>' +
                '</div>' +
              '</article>';
      dots += '<button class="dot-hit" type="button" data-i="' + i + '" aria-label="' + esc(L(p.name)) + '"><span class="dot"></span></button>';
    }
    rackEl.innerHTML = html;
    $("dots").innerHTML = dots;
    cardEls = Array.prototype.slice.call(rackEl.querySelectorAll(".pcard"));
    n = cardEls.length;
    rackEl.setAttribute("aria-label", L(CFG.ui.rackLabel));

    var dotBtns = $("dots").querySelectorAll(".dot-hit");
    for(var d=0;d<dotBtns.length;d++){
      dotBtns[d].addEventListener("click", function(){
        go(parseInt(this.getAttribute("data-i"), 10));
      });
    }
    measure();
    place();
  }

  function render(){
    var c = CFG;
    document.title = L(c.campaign.documentTitle) + " | Anthony's Supermarket";
    var md = $("metaDesc"); if(md) md.setAttribute("content", L(c.campaign.metaDescription));

    setText("brandTag", L(c.store.tagline));
    setHTML("heroTitle", '<span class="r">' + esc(L(c.campaign.titleA)) + '</span> <span class="g">' + esc(L(c.campaign.titleB)) + '</span>');
    setText("heroSub", L(c.campaign.tagline));
    setHTML("dealPrice", esc(L(c.deal.headline)) + ' <b>' + esc(c.deal.price) + '</b>');
    setText("dealDetail", L(c.deal.detail));
    setText("dealSave", L(c.deal.save));
    setText("dealBadge", L(c.deal.badge));
    setText("fomoText", L(c.deal.fomo));

    setHTML("showTitle", L(c.showcase.title));
    setText("showSub", L(c.showcase.sub));
    setText("hint", L(c.showcase.hint));
    $("btnPrev").setAttribute("aria-label", L(c.ui.prev));
    $("btnNext").setAttribute("aria-label", L(c.ui.next));
    setText("dClose", L(c.ui.close));

    setHTML("howTitle", L(c.how.title));
    var hh = "";
    for(var i=0;i<c.how.steps.length;i++){
      var s = c.how.steps[i];
      hh += '<div class="how-card"><div class="n">' + esc(s.n) + '</div><h3>' + esc(L(s.title)) + '</h3><p>' + esc(L(s.body)) + '</p></div>';
    }
    setHTML("howGrid", hh);

    setHTML("pairTitle", L(c.pairings.title));
    setText("pairSub", L(c.pairings.sub));
    var ph = "";
    for(var j=0;j<c.pairings.items.length;j++){
      var it = c.pairings.items[j];
      ph += '<div class="pchip"><span class="tag">' + esc(L(it.tag)) + '</span>' + esc(it.items) + '</div>';
    }
    setHTML("pairRow", ph);

    setHTML("recTitle", L(c.recipes.title));
    var rh = "";
    for(var k=0;k<c.recipes.items.length;k++){
      var r = c.recipes.items[k];
      rh += '<div class="recipe"><h3>' + esc(L(r.title)) + '</h3><p>' + L(r.body) + '</p></div>';
    }
    setHTML("recGrid", rh);

    var pBase = cl === "es" ? c.poster.es : c.poster.en;
    var pExt  = cl === "es" ? c.poster.esExt : c.poster.enExt;
    setHTML("posterPic", picture(pBase, pExt, "poster-img", L(c.poster.alt), "lazy"));
    setText("posterCap", L(c.poster.caption));

    $("shareSale").href = waLink(L(c.share.saleText));
    $("shareSale").textContent = "💬 " + L(c.share.buttonSale);
    setText("copyLink", "🔗 " + L(c.share.buttonCopy));

    setText("fBrand", c.store.name);
    setText("fAddr", c.store.address);
    setText("fHours", L(c.store.hours));
    $("fMaps").href = c.store.mapsUrl;
    $("fMaps").textContent = L(c.store.directions);
    $("fIg").href = c.store.instagramUrl;
    $("fIg").textContent = "📷 " + c.store.instagram;
    setText("fBadge", L(c.deal.badge));

    renderCards();
    showDetail(clamp(Math.round(pos), 0, n - 1), false);
  }

  /* ============================================================
     Boot
     ============================================================ */
  function fail(msg){
    $("loading").textContent = msg;
    $("loading").hidden = false;
  }

  function valid(c){
    return c && c.campaign && c.deal && c.products && c.products.length &&
           c.store && c.ui && c.share && c.showcase && c.how && c.pairings && c.recipes && c.poster;
  }

  function boot(){
    rackEl = $("rack"); stageEl = $("stage");

    fetch("data/sale.json", {cache:"no-cache"})
      .then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(cfg){
        if(!valid(cfg)) throw new Error("incomplete config");
        CFG = cfg;
        try{ var sl = localStorage.getItem("anthony-lang"); if(sl === "es" || sl === "en") cl = sl; }catch(e){}
        document.documentElement.lang = cl;
        var btns = document.querySelectorAll(".lang-btn");
        for(var i=0;i<btns.length;i++){
          btns[i].classList.toggle("active", btns[i].textContent.toLowerCase().indexOf(cl) >= 0);
        }

        $("loading").hidden = true;
        $("app").hidden = false;
        render();

        bindDrag();
        bindKeys();
        bindSheet();
        $("btnPrev").addEventListener("click", function(){ go(Math.round(pos) - 1); });
        $("btnNext").addEventListener("click", function(){ go(Math.round(pos) + 1); });
        $("copyLink").addEventListener("click", function(){ copyText(L(CFG.share.saleText) + " " + pageUrl()); });

        /* wide layout only when there is room for a docked panel */
        function layoutMode(){
          $("showcase").classList.toggle("wide", window.innerWidth >= 861);
          if(!mqSheet.matches) closeSheetSilently();
          measure(); place();
        }
        function closeSheetSilently(){
          $("detail").classList.remove("open");
          $("detail").setAttribute("aria-modal","false");
          $("sheetBd").classList.remove("on");
        }
        layoutMode();
        window.addEventListener("resize", layoutMode);
        window.addEventListener("orientationchange", function(){ setTimeout(layoutMode, 120); });

        /* pause work while the rack is off-screen */
        if("IntersectionObserver" in window){
          new IntersectionObserver(function(entries){
            live = entries[0].isIntersecting;
            if(!live && anim){ cancelAnimationFrame(anim); anim = null; pos = target; place(); }
          }, {threshold:0.05}).observe(stageEl);
        }
      })
      .catch(function(err){
        var msg = "We couldn't load this week's sale. Come see us at 288 Kearny Ave, Kearny NJ — Mon–Sat 7AM–8PM.";
        try{ if(CFG && CFG.ui) msg = L(CFG.ui.error); }catch(e){}
        fail(msg);
        if(window.console && console.warn) console.warn("[sales] config load failed:", err && err.message);
      });
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
