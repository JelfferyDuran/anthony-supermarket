services:
  - type: web
    name: anthonys-order-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: node superkitchen-bot-v2.js
    healthCheckPath: /api/health
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: KITCHEN_CHAT_ID
        sync: false
      - key: MINIAPP_URL
        value: https://jelfferyduran.github.io/anthony-supermarket/apps/superkitchen/dist/
      - key: MINIAPP_API_URL
        value: https://cbpdiiyzzmbavsymjysb.supabase.co/functions/v1/superkitchen

  - type: web
    name: superkitchen-mini-app
    runtime: node
    rootDir: apps/superkitchen
    buildCommand: npm ci && npm run build && cd server && npm ci
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: BOT_URL
        value: https://t.me/Anthonysuperkitchen_bot
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
