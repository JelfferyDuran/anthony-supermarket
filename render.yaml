services:
  - type: web
    name: anthonys-order-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: KITCHEN_CHAT_ID
        sync: false
      - key: TELEGRAM_BOT_URL
        value: https://t.me/SuperAnthbot
      - key: ALLOWED_ORIGINS
        value: https://jelfferyduran.github.io
      - key: TAX_RATE
        value: "0"

  - type: web
    name: superkitchen-mini-app
    runtime: node
    rootDir: apps/superkitchen
    buildCommand: npm ci && npm run build && cd server && npm ci
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: BOT_URL
        value: https://t.me/SuperAnthbot
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
