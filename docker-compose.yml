version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: anthony-supermarket-server
    ports:
      - "3401:3001"   # host 3401 (3001 blocked by Windows excluded range 3001-3100)
    env_file:
      - server/.env
    environment:
      - NODE_ENV=production
      - MINIAPP_API_URL=https://cbpdiiyzzmbavsymjysb.functions.supabase.co/superkitchen
      - MINIAPP_URL=https://jelfferyduran.github.io/anthony-supermarket/apps/superkitchen/dist/
    volumes:
      - ./server/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/pricing-hub/', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
