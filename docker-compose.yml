version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: anthony-supermarket-server
    ports:
      - "3401:3001"   # host 3401 (3001 blocked by Windows excluded range 3001-3100)
    env_file:
      - server/.env
    environment:
      - NODE_ENV=production
      - MINIAPP_API_URL=https://cbpdiiyzzmbavsymjysb.functions.supabase.co/superkitchen
      - MINIAPP_URL=https://jelfferyduran.github.io/anthony-supermarket/apps/superkitchen/dist/
    volumes:
      - ./server/data:/app/data
    restart: unless-stopped
    healthcheck:
      # Smoke guard: healthy means the menu loaded WITH items. /api/health
      # returns 503 when 0 items are loaded, so an empty-menu regression
      # (e.g. a host-only MENU_DATA_PATH shadowing the image seed) flips the
      # container to unhealthy instead of silently serving {menus: []}.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => { if (r.statusCode !== 200) { process.exit(1) } })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
